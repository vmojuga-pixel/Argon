[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argon-sdk"
version = "2.0.0"
description = "Official Python SDK for the Argon AI API platform"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vmojuga-pixel" }]
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["argon*"]
